# dsh-browser 独立 workspace：桥接插件与 Chrome 扩展自包含安装。
packages:
  - extensions/*
  - packages/*/*

# DSH peer providers 由工作区显式提供，统一使用 0.2.1-rc.5。
autoInstallPeers: false

# OpenTelemetry SDK 的 peer 范围要求 API 低于 1.10.0。
overrides:
  '@opentelemetry/api': 1.9.1

# dsh 运行时与扩展构建依赖这些受信任包的安装脚本。
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true

# 内测版 @deepseek-ai 包需要在发布后立即安装。
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
