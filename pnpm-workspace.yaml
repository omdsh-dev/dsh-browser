# dsh-browser 独立 workspace：桥接插件与 Chrome 扩展自包含安装。
packages:
  - extensions/*
  - packages/*/*

# DSH peer providers 由工作区显式提供，统一使用 0.2.2-rc.5。
autoInstallPeers: false

overrides:
  # OpenTelemetry SDK 的 peer 范围要求 API 低于 1.10.0。
  '@opentelemetry/api': 1.9.1
  # 修复 DSH 间接依赖中的跨域泄露、网络请求崩溃和文件解析拒绝服务。
  '@modelcontextprotocol/client@>=2.0.0 <2.3.0': 2.3.0
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'fflate@>=0.8.0 <0.8.3': 0.8.3
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2

# dsh 运行时与扩展构建依赖这些受信任包的安装脚本。
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true

# 内测版 @deepseek-ai 包需要在发布后立即安装。
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
