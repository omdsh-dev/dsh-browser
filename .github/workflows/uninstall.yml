name: Uninstall lifecycle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  uninstall:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TEST_PWSH: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dsh-browser-extension build
      - run: pnpm test:uninstall
